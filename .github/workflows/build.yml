name: Build APK

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Token & Meta SDK Access
        env:
          GH_TOKEN: ${{ secrets.SDK_GITHUB_TOKEN }}
        run: |
          echo "=========================================="
          if [ -z "$GH_TOKEN" ]; then
            echo "ОШИБКА: Секрет SDK_GITHUB_TOKEN пустой!"
            exit 1
          fi

          PREFIX=$(echo "$GH_TOKEN" | cut -c 1-4)
          echo "Префикс вашего токена: $PREFIX"

          if [[ "$PREFIX" != "ghp_" ]]; then
            echo "ОШИБКА: Токен должен начинаться на 'ghp_'. Вы создали Fine-grained токен вместо Classic!"
            exit 1
          fi

          echo "Проверяем доступ к пакету Meta mwdat-core:0.4.0..."
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" -u "${{ github.actor }}:$GH_TOKEN" "https://maven.pkg.github.com/facebook/meta-wearables-dat-android/com/meta/wearable/mwdat-core/0.4.0/mwdat-core-0.4.0.pom")
          echo "Код ответа от GitHub Packages: $HTTP_CODE"

          if [ "$HTTP_CODE" != "200" ]; then
            echo "ОШИБКА: Сервер вернул код $HTTP_CODE вместо 200 OK!"
            exit 1
          fi
          echo "Авторизация в Meta SDK прошла успешно!"
          echo "=========================================="

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configure and Build
        env:
          GH_TOKEN: ${{ secrets.SDK_GITHUB_TOKEN }}
          GEMINI_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          cd samples/CameraAccessAndroid

          if [ -f "gradle.properties" ]; then
            sed -i '/org.gradle.java.home/d' gradle.properties
          fi

          echo "github_token=$GH_TOKEN" > local.properties

          SECRET_PATH="app/src/main/java/com/meta/wearable/dat/externalsampleapps/cameraaccess"
          if [ -f "$SECRET_PATH/Secrets.kt.example" ]; then
            cp "$SECRET_PATH/Secrets.kt.example" "$SECRET_PATH/Secrets.kt"
            if [ -n "$GEMINI_KEY" ]; then
              sed -i "s/YOUR_GEMINI_API_KEY/$GEMINI_KEY/g" "$SECRET_PATH/Secrets.kt" || true
              sed -i "s/\"\"/\"$GEMINI_KEY\"/g" "$SECRET_PATH/Secrets.kt" || true
            fi
          fi

          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VisionClaw-APK
          path: samples/CameraAccessAndroid/app/build/outputs/apk/debug/*.apk
