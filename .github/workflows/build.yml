name: Build APK

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Diagnose and Configure
        env:
          GH_TOKEN: ${{ secrets.SDK_GITHUB_TOKEN }}
          GEMINI_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          cd samples/CameraAccessAndroid

          echo "=== 1. Проверка типа токена ==="
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::Секрет SDK_GITHUB_TOKEN пустой!"
            exit 1
          fi
          echo "Длина токена: ${#GH_TOKEN} символов"
          TOKEN_PREFIX=$(echo "$GH_TOKEN" | cut -c 1-4)
          echo "Префикс токена: $TOKEN_PREFIX"
          if [[ "$TOKEN_PREFIX" == "gith" ]]; then
            echo "::error::Внимание! Вы используете Fine-grained токен (github_pat_). Нужен Classic токен (ghp_)!"
          fi

          echo "=== 2. Содержимое settings.gradle.kts ==="
          cat settings.gradle.kts || cat settings.gradle || true
          echo "=========================================="

          echo "=== 3. Проверка ответа GitHub Packages ==="
          curl -i -u "${{ github.actor }}:$GH_TOKEN" "https://maven.pkg.github.com/facebook/meta-wearables-dat-android/com/meta/wearable/mwdat-core/0.4.0/mwdat-core-0.4.0.pom" || true

          # Удаление локальных путей macOS
          if [ -f "gradle.properties" ]; then
            sed -i '/org.gradle.java.home/d' gradle.properties
          fi

          # Запись данных авторизации во все конфиги
          for file in local.properties gradle.properties; do
            echo "github_token=$GH_TOKEN" >> $file
            echo "github_user=${{ github.actor }}" >> $file
            echo "github_username=${{ github.actor }}" >> $file
            echo "gpr.token=$GH_TOKEN" >> $file
            echo "gpr.user=${{ github.actor }}" >> $file
          done

          # Настройка Secrets.kt
          SECRET_PATH="app/src/main/java/com/meta/wearable/dat/externalsampleapps/cameraaccess"
          if [ -f "$SECRET_PATH/Secrets.kt.example" ]; then
            cp "$SECRET_PATH/Secrets.kt.example" "$SECRET_PATH/Secrets.kt"
            if [ -n "$GEMINI_KEY" ]; then
              sed -i "s/YOUR_GEMINI_API_KEY/$GEMINI_KEY/g" "$SECRET_PATH/Secrets.kt" || true
              sed -i "s/\"\"/\"$GEMINI_KEY\"/g" "$SECRET_PATH/Secrets.kt" || true
            fi
          fi

      - name: Make gradlew executable
        run: |
          cd samples/CameraAccessAndroid
          chmod +x gradlew

      - name: Build APK with Gradle
        env:
          GITHUB_TOKEN: ${{ secrets.SDK_GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.SDK_GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          cd samples/CameraAccessAndroid
          ./gradlew assembleDebug --stacktrace -Pgithub_token="${{ secrets.SDK_GITHUB_TOKEN }}" -Pgithub_user="${{ github.actor }}"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VisionClaw-APK
          path: samples/CameraAccessAndroid/app/build/outputs/apk/debug/*.apk
