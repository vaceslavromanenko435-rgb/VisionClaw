name: Build APK

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Prepare Configuration & Test Token
        env:
          GH_TOKEN: ${{ secrets.SDK_GITHUB_TOKEN }}
          GEMINI_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          cd samples/CameraAccessAndroid

          echo "=== Проверка доступности библиотеки Meta через токен ==="
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -u "${{ github.actor }}:$GH_TOKEN" "https://maven.pkg.github.com/facebook/meta-wearables-dat-android/com/meta/wearable/mwdat-core/0.4.0/mwdat-core-0.4.0.pom")
          echo "Ответ от GitHub Packages: $HTTP_STATUS"

          if [ "$HTTP_STATUS" != "200" ]; then
            echo "::warning::GitHub Packages вернул код $HTTP_STATUS. Если это 401 или 404, то токен не подошел."
          fi

          # Удаляем пути к macOS
          if [ -f "gradle.properties" ]; then
            sed -i '/org.gradle.java.home/d' gradle.properties
          fi

          # Заполняем все возможные варианты переменных
          for file in local.properties gradle.properties; do
            echo "github_token=$GH_TOKEN" >> $file
            echo "github_user=${{ github.actor }}" >> $file
            echo "github_username=${{ github.actor }}" >> $file
            echo "gpr.token=$GH_TOKEN" >> $file
            echo "gpr.key=$GH_TOKEN" >> $file
            echo "gpr.user=${{ github.actor }}" >> $file
          done

          # Внедряем прямую авторизацию в settings.gradle.kts
          python3 -c "
          import re
          path = 'settings.gradle.kts'
          with open(path, 'r') as f:
              content = f.read()
          
          # Заменяем блок репозитория Meta на гарантированную авторизацию
          auth_block = '''maven {
                  url = uri(\"https://maven.pkg.github.com/facebook/meta-wearables-dat-android\")
                  credentials {
                      username = \"${{ github.actor }}\"
                      password = \"$GH_TOKEN\"
                  }
              }'''
          new_content = re.sub(r'maven\s*\{\s*url\s*=\s*uri\([\"\\\']https://maven\.pkg\.github\.com/facebook/meta-wearables-dat-android[\"\\\']\)[^}]*\}', auth_block, content, flags=re.DOTALL)
          with open(path, 'w') as f:
              f.write(new_content)
          "

          # Настройка Secrets.kt
          SECRET_PATH="app/src/main/java/com/meta/wearable/dat/externalsampleapps/cameraaccess"
          if [ -f "$SECRET_PATH/Secrets.kt.example" ]; then
            cp "$SECRET_PATH/Secrets.kt.example" "$SECRET_PATH/Secrets.kt"
            if [ -n "$GEMINI_KEY" ]; then
              sed -i "s/YOUR_GEMINI_API_KEY/$GEMINI_KEY/g" "$SECRET_PATH/Secrets.kt" || true
              sed -i "s/\"\"/\"$GEMINI_KEY\"/g" "$SECRET_PATH/Secrets.kt" || true
            fi
          fi

      - name: Make gradlew executable
        run: |
          cd samples/CameraAccessAndroid
          chmod +x gradlew

      - name: Build APK with Gradle
        env:
          GITHUB_TOKEN: ${{ secrets.SDK_GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.SDK_GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          cd samples/CameraAccessAndroid
          ./gradlew assembleDebug --stacktrace -Pgithub_token="${{ secrets.SDK_GITHUB_TOKEN }}" -Pgithub_user="${{ github.actor }}"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VisionClaw-APK
          path: samples/CameraAccessAndroid/app/build/outputs/apk/debug/*.apk
